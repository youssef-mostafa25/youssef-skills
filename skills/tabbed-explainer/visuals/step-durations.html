<!--
  step-durations · Timeline / Compare options
  Use when: a set of steps or timeouts each has a duration and the reader compares them on one shared time axis (which timeout fires first, which step takes longest).
  Not for: steps that run one after another and need start times (use a timeline / gantt) or values against a single limit (use bars-limit).
  Fill: the DATA object: unit, kinds {key: [label, colour]} and steps {label, value, kind}. Colours appear in the key only if more than one kind is used.
-->
<figure class="viz" id="sd-1">
  <div class="viz-title">{{The point of the chart, e.g. "The 30 s execute timeout fires long before anything else in the turn"}}</div>
  <div class="viz-body"><svg role="img"></svg></div>
  <div class="viz-key"></div>
  <p class="viz-note">{{How to read it, e.g. "Each bar is one timeout in a single agent turn, all on the same seconds axis."}}</p>
</figure>
<script>
(function () {
  var DATA = {
    unit: 's',
    kinds: { runner: ['Runner timeout', 'var(--c2)'], agent: ['Agent timeout', 'var(--c3)'], short: ['Cuts the turn short', 'var(--bad)'] },
    steps: [
      { label: 'Source config fetch (Runner → Database)', value: 15, kind: 'runner' },
      { label: 'Agent → Runner /query/execute', value: 30, kind: 'short' },
      { label: 'Runner reads the request body', value: 60, kind: 'runner' },
      { label: 'Runner writes the response', value: 120, kind: 'runner' },
      { label: 'Agent → Runner /query/profile', value: 180, kind: 'agent' },
      { label: 'Runner query timeout (Database)', value: 300, kind: 'runner' },
      { label: 'Whole deep agent stream for the turn', value: 600, kind: 'agent' }
    ]
  };
  var fig = document.getElementById('sd-1'), svg = fig.querySelector('svg'), NS = 'http://www.w3.org/2000/svg';
  var ctx = document.createElement('canvas').getContext('2d'); ctx.font = '13px "IBM Plex Sans", system-ui, sans-serif';
  var labW = Math.ceil(Math.max.apply(null, DATA.steps.map(function (s) { return ctx.measureText(s.label).width; })) * 1.06) + 4;
  var max = Math.max.apply(null, DATA.steps.map(function (s) { return s.value; }));
  var mag = Math.pow(10, Math.floor(Math.log10(max / 6))), step = [1, 2, 5, 10].map(function (m) { return m * mag; }).filter(function (s) { return max / s <= 7; })[0];
  var top = Math.ceil(max / step) * step;
  var plotL = labW + 12, plotW = 520, rowH = 36, barH = 22, padT = 8, W = plotL + plotW + 52, H = padT + DATA.steps.length * rowH + 30;
  var x = function (v) { return plotL + v / top * plotW; };
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.style.minWidth = Math.round(W * 0.8) + 'px';
  svg.setAttribute('aria-label', DATA.steps.map(function (s) { return s.label + ' ' + s.value + DATA.unit; }).join(', '));
  function mk(t, a, text) { var el = document.createElementNS(NS, t); for (var k in a) el.setAttribute(k, a[k]); if (text != null) el.textContent = text; svg.appendChild(el); return el; }
  for (var v = 0; v <= top; v += step) {
    mk('line', { x1: x(v), x2: x(v), y1: padT - 4, y2: H - 24, style: 'stroke:var(--line)' });
    mk('text', { x: x(v), y: H - 6, 'text-anchor': 'middle', 'class': 'm', style: 'font-family:var(--font-mono)' }, v + DATA.unit);
  }
  DATA.steps.forEach(function (s, i) {
    var cy = padT + i * rowH + rowH / 2, k = DATA.kinds[s.kind] || ['', 'var(--c1)'];
    mk('text', { x: labW, y: cy + 4.5, 'text-anchor': 'end', style: 'font-size:13px' }, s.label);
    mk('rect', { x: x(0), y: cy - barH / 2, width: Math.max(x(s.value) - x(0), 3), height: barH, rx: 4, style: 'fill:' + k[1] })
      .setAttribute('data-tip', s.label + '\n' + s.value + DATA.unit + (k[0] ? ' · ' + k[0] : ''));
    mk('text', { x: x(s.value) + 6, y: cy + 4.5, style: 'font-family:var(--font-mono);font-size:12.5px' }, s.value + DATA.unit);
  });
  var used = {}; DATA.steps.forEach(function (s) { used[s.kind] = 1; });
  var keys = Object.keys(DATA.kinds).filter(function (k) { return used[k]; });
  fig.querySelector('.viz-key').innerHTML = keys.length > 1 ? keys.map(function (k) { return '<span><i style="--k:' + DATA.kinds[k][1] + '"></i>' + DATA.kinds[k][0] + '</span>'; }).join('') : '';
  if (keys.length < 2) fig.querySelector('.viz-key').remove();
})();
</script>
